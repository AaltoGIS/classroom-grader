name: grader

channels:
  - conda-forge

dependencies:
  - python=3.14
  - git
  - gh
  - jupyterlab=4.5  # as in the course's JupyterLab image
  - jupyterlab-git=0.52.0  # 0.53-0.55 cannot clone private repositories (jupyterlab-git #1549)
  - nbgrader
  - access
  - contextily
  - dask
  - dask-ml
  - datashader
  - esda
  - geojson
  - geopandas
  - geoplot
  - geoviews
  - hvplot
  - inequality
  - jinja2
  - mapclassify
  - matplotlib
  - mesa
  - mgwr
  - momepy
  - movingpandas
  - networkx
  - nose
  - openjdk
  - openpyxl
  - osmnx
  - palettable
  - pandas
  - plotly
  - pointpats
  - pyinterpolate
  - pykrige
  - pyrosm
  - pysal
  - python-igraph
  - r5py.sampledata.helsinki>=0.1.1dev2
  - r5py.sampledata.sao_paulo>=0.1.1dev2
  - rioxarray
  - scikit-image
  - scikit-learn
  - scikit-mobility
  - scipy
  - seaborn
  - segregation
  - simpy
  - spint
  - splot
  - spreg
  - statsmodels
  - xarray
  - xarray-spatial
  - pip
  - pip:
      - r5py==1.0.0.dev0
      - git+https://github.com/AaltoGIS/classroom-grader
